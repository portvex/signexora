[package]
name = "sn-gui"
description = "SigNexora signal intelligence tool: a cross-platform desktop application built with GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The SigNexora desktop program.
[[bin]]
name = "signexora"
path = "src/main.rs"

[dependencies]
# The settings file lives in the platform's configuration folder.
dirs = "5"
gpui.workspace = true
# The sonogram image is handed to GPUI as an `image` frame (GPUI's own
# dependency, same version).
image = { version = "0.25", default-features = false, features = ["png"] }
sn-analysis.workspace = true
sn-core.workspace = true
sn-dsp.workspace = true
sn-io.workspace = true
sn-script.workspace = true
sn-session.workspace = true
sn-synth.workspace = true
sn-ui-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# Debug builds on macOS save PNGs of the app's own window (src/shot.rs). Same
# versions as GPUI's own macOS dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.0"
core-graphics = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
# The macOS looks give the main window's native title bar their light or dark
# appearance (src/app/mac_window.rs). Same versions as GPUI's own.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
raw-window-handle = "0.6"

[dev-dependencies]
# GPUI's test platform: behaviour tests with simulated input inside the test
# app (no real window, nothing reaches the desktop).
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
