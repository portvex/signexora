# cargo audit configuration. Run with `cargo audit` or `scripts/deps.sh`.
# Keep this list in step with [advisories] ignore in deny.toml, which gives the
# reason for each entry.

[advisories]
ignore = [
    "RUSTSEC-2026-0249", # smartstring (via rhai)
    "RUSTSEC-2026-0192", # ttf-parser (via gpui's fontdb/usvg)
    "RUSTSEC-2026-0370", # zvariant (via gpui's ashpd/zbus on Linux)
    "RUSTSEC-2026-0371", # zbus_names (via gpui's ashpd/zbus on Linux)
    "RUSTSEC-2026-0372", # zvariant_derive (via gpui's ashpd/zbus on Linux)
    "RUSTSEC-2024-0384", # instant (via gpui)
    "RUSTSEC-2026-0441", # pin-utils (via gpui)
    "RUSTSEC-2026-0206", # rustybuzz (via gpui)
    "RUSTSEC-2025-0052", # async-std (via gpui)
    "RUSTSEC-2024-0436", # paste (via gpui)
    "RUSTSEC-2026-0173", # proc-macro-error2 (via gpui)
    "RUSTSEC-2025-0134", # rustls-pemfile (via gpui)
    "RUSTSEC-2026-0183", # git2, test builds only (gpui test-support)
    "RUSTSEC-2026-0184", # git2, test builds only (gpui test-support)
]
informational_warnings = ["unmaintained", "unsound", "notice"]

[output]
deny = ["warnings"]
quiet = false
